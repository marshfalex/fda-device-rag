name: Keep Streamlit app awake

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        run: curl -sS -L -o /dev/null -w "%{http_code}\n" --max-time 60 https://fda-device-rag.streamlit.app || true
