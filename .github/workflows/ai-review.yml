name: AI review

# Advisory only: posts a COMMENT review. It cannot approve or block merges;
# branch protection requires a human approval.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs don't get secrets; skip instead of failing.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "anthropic>=2.10" "requests>=2.31"
      - name: Build diff
        run: git diff --unified=5 "origin/${{ github.base_ref }}...HEAD" -- . ':(exclude)*.lock' ':(exclude)data/**' ':(exclude)eval/ai_review/cases/**' > pr.diff
      - name: Review
        env:
          # Uses Claude if ANTHROPIC_API_KEY is set, otherwise Groq's free tier.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$GROQ_API_KEY" ]; then
            echo "::notice::No ANTHROPIC_API_KEY or GROQ_API_KEY secret; skipping AI review."
            exit 0
          fi
          if [ ! -s pr.diff ]; then echo "Empty diff; nothing to review."; exit 0; fi
          python -m tools.ai_review.review --diff-file pr.diff --post
