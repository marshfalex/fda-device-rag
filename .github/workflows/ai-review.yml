name: AI review

# Advisory only: posts a COMMENT review. It cannot approve or block merges;
# branch protection requires a human approval.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs don't get secrets; skip instead of failing.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "anthropic>=2.10" "requests>=2.31"
      - name: Build diff
        run: git diff --unified=5 "origin/${{ github.base_ref }}...HEAD" -- . ':(exclude)*.lock' ':(exclude)data/**' > pr.diff
      - name: Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python -m tools.ai_review.review --diff-file pr.diff --post
