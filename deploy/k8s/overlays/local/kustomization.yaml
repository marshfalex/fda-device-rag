apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Single-node RKE2 on the laptop (WSL2). Same base as OCI; only the host and
# replica limits differ. Open http://rag.localhost in a Windows browser.
resources:
  - ../../base
images:
  - name: rag-app
    newName: ghcr.io/marshfalex/fda-device-rag
    newTag: sha-4d3f186
patches:
  - target: {kind: Ingress, name: rag-app}
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: rag.localhost
  - target: {kind: HorizontalPodAutoscaler, name: rag-app}
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 2
