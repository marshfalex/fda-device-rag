apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-app
  annotations:
    # Streamlit keeps a websocket per browser session -> sticky sessions
    # so HPA-added replicas don't break live sessions.
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/session-cookie-name: rag-affinity
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: rag.REPLACE_LB_IP.nip.io   # patched in the overlay
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rag-app
                port: {name: http}
