apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rag-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/marshfalex/fda-device-rag.git
    targetRevision: master
    path: deploy/k8s/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: rag
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
